      CORE_PEER_ADDRESS: peer1.org3.pdasp.com:${PEER1_ORG3_PORT}
      CORE_PEER_LISTENADDRESS: 0.0.0.0:${PEER1_ORG3_PORT}
      CORE_PEER_CHAINCODEADDRESS: peer1.org3.pdasp.com:9152
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:9152
