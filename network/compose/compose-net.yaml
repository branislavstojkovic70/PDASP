      CORE_PEER_ADDRESS: peer2.org1.pdasp.com:${PEER2_ORG1_PORT}
      CORE_PEER_LISTENADDRESS: 0.0.0.0:${PEER2_ORG1_PORT}
      CORE_PEER_CHAINCODEADDRESS: peer2.org1.pdasp.com:7252
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7252
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer2.org1.pdasp.com:${PEER2_ORG1_PORT}
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.org1.pdasp.com:${PEER0_ORG1_PORT}
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb2:5984
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:${PEER2_ORG1_OPS_PORT}
    ports:
      - "${PEER2_ORG1_PORT}:${PEER2_ORG1_PORT}"
      - "${PEER2_ORG1_OPS_PORT}:${PEER2_ORG1_OPS_PORT}"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/org1.pdasp.com/peers/peer2.org1.pdasp.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/org1.pdasp.com/peers/peer2.org1.pdasp.com/tls:/etc/hyperledger/fabric/tls
      - peer2.org1.pdasp.com:/var/hyperledger/production

  # ------------------------------------------------------- Org2: "Customers"
  peer0.org2.pdasp.com:
    <<: *peer-common
    container_name: peer0.org2.pdasp.com
    depends_on: [couchdb3]
    environment:
      <<: *peer-environment
      CORE_PEER_ID: peer0.org2.pdasp.com
