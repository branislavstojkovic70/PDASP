      - ../organizations/peerOrganizations/org3.pdasp.com/peers/peer0.org3.pdasp.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/org3.pdasp.com/peers/peer0.org3.pdasp.com/tls:/etc/hyperledger/fabric/tls
