      - ../organizations/peerOrganizations/org1.pdasp.com/peers/peer1.org1.pdasp.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/org1.pdasp.com/peers/peer1.org1.pdasp.com/tls:/etc/hyperledger/fabric/tls
