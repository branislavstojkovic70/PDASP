      CORE_PEER_GOSSIP_BOOTSTRAP: peer1.org2.pdasp.com:${PEER1_ORG2_PORT}
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb3:5984
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:${PEER0_ORG2_OPS_PORT}
    ports:
