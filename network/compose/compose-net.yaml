      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.org3.pdasp.com:${PEER0_ORG3_PORT}
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb7:5984
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:${PEER1_ORG3_OPS_PORT}
    ports:
