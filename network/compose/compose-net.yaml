      - ../organizations/peerOrganizations/org3.pdasp.com/peers/peer1.org3.pdasp.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/org3.pdasp.com/peers/peer1.org3.pdasp.com/tls:/etc/hyperledger/fabric/tls
      - peer1.org3.pdasp.com:/var/hyperledger/production

  peer2.org3.pdasp.com:
    <<: *peer-common
    container_name: peer2.org3.pdasp.com
    depends_on: [couchdb8]
    environment:
      <<: *peer-environment
      CORE_PEER_ID: peer2.org3.pdasp.com
      CORE_PEER_LOCALMSPID: ${ORG3_MSP}
      CORE_PEER_ADDRESS: peer2.org3.pdasp.com:${PEER2_ORG3_PORT}
      CORE_PEER_LISTENADDRESS: 0.0.0.0:${PEER2_ORG3_PORT}
      CORE_PEER_CHAINCODEADDRESS: peer2.org3.pdasp.com:9252
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:9252
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer2.org3.pdasp.com:${PEER2_ORG3_PORT}
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.org3.pdasp.com:${PEER0_ORG3_PORT}
      CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS: couchdb8:5984
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:${PEER2_ORG3_OPS_PORT}
    ports:
      - "${PEER2_ORG3_PORT}:${PEER2_ORG3_PORT}"
      - "${PEER2_ORG3_OPS_PORT}:${PEER2_ORG3_OPS_PORT}"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations/peerOrganizations/org3.pdasp.com/peers/peer2.org3.pdasp.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/org3.pdasp.com/peers/peer2.org3.pdasp.com/tls:/etc/hyperledger/fabric/tls
      - peer2.org3.pdasp.com:/var/hyperledger/production

  # ------------------------------------------------------------ CLI container
  # Not part of the network itself: it exists for ad hoc `peer` commands and
  # inspection during development. The host scripts use the local binaries in
  # network/bin rather than this container.
  cli:
    image: hyperledger/fabric-tools:${IMAGE_TAG}
    container_name: cli
    labels:
      pdasp.role: cli
    tty: true
    stdin_open: true
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash
    environment:
      FABRIC_LOGGING_SPEC: ${FABRIC_LOGGING_SPEC}
      CORE_PEER_TLS_ENABLED: "true"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../organizations:/opt/gopath/src/github.com/hyperledger/fabric/peer/organizations
      - ../channel-artifacts:/opt/gopath/src/github.com/hyperledger/fabric/peer/channel-artifacts
      - ../../chaincode:/opt/gopath/src/github.com/hyperledger/fabric/peer/chaincode
    networks:
      - pdasp
