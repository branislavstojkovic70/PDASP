      CORE_PEER_ADDRESS: peer1.org2.pdasp.com:${PEER1_ORG2_PORT}
      CORE_PEER_LISTENADDRESS: 0.0.0.0:${PEER1_ORG2_PORT}
      CORE_PEER_CHAINCODEADDRESS: peer1.org2.pdasp.com:8152
